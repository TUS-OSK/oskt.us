name: Github Pages Pusher

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Install packages
        run: yarn install

      - name: Build
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          yarn build

        # これがないとアンスコから始まるファイルが読み込まれない
      - name: Add nojekyll
        run: touch ./out/.nojekyll

        # PRプレビューと同じ gh-pages ブランチを共有するため、本番デプロイの掃除で
        # pr-preview/ 配下を消さないよう clean-exclude で除外する（peaceiris から
        # 移行したのはこの除外指定ができるため。それ以外の挙動は従来と同じ）。
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: out
          clean-exclude: pr-preview/
